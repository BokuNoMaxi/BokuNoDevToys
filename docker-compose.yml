services:
  devtoys:
    container_name: devtoys
    build:
      context: .
      args:
        COMMIT_HASH: ${COMMIT_HASH:-dev}
    ports:
      - "34291:80"
    restart: unless-stopped
    volumes:
      - ./build:/usr/share/nginx/html:ro

  mcp:
    container_name: devtoys-mcp
    build:
      context: .
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    expose:
      - "3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0

  builder:
    image: node:20-alpine
    container_name: devtoys-builder
    working_dir: /app
    volumes:
      - .:/app
      - devtoys_node_modules:/app/node_modules
    profiles:
      - build

volumes:
  devtoys_node_modules:
