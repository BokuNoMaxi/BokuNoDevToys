name: Deploy

on:
  push:
    branches: [main]

# Nur ein Deploy gleichzeitig; laufende Pushes werden in Reihe abgearbeitet statt
# einen halbfertigen Deploy abzubrechen.
concurrency:
  group: deploy-devtoys
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, devtoys]
    steps:
      - name: Pull latest code
        id: pull
        run: |
          set -e
          cd /mnt/data/claude/BokuNoDevToys
          before=$(git rev-parse HEAD)
          git fetch origin main
          git merge --ff-only origin/main
          after=$(git rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Detect if full rebuild is needed
        id: check
        run: |
          set -e
          cd /mnt/data/claude/BokuNoDevToys
          if git diff --name-only "${{ steps.pull.outputs.before }}" "${{ steps.pull.outputs.after }}" \
             | grep -qE '^(package(-lock)?\.json|Dockerfile|nginx\.conf)$'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Full rebuild (dependency/Dockerfile/nginx changes)
        if: steps.check.outputs.full == 'true'
        run: |
          set -e
          cd /mnt/data/claude/BokuNoDevToys
          docker compose build --no-cache
          docker compose up -d

      - name: Quick build (code/content changes only)
        if: steps.check.outputs.full == 'false'
        run: |
          set -e
          cd /mnt/data/claude/BokuNoDevToys
          docker compose run --rm builder npm run build
          docker compose restart devtoys
