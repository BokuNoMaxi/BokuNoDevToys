name: Deploy

on:
  push:
    branches: [main]
  # Nachts neu bauen, damit Sicherheitsupdates des nginx-Basis-Abbilds ohne
  # Code-Aenderung ankommen (Cron ist UTC, der Server laeuft auf UTC).
  # Server: Backup 00:00, Image-Updates 00:30, Auto-Neustart 02:30.
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

# Nur ein Deploy gleichzeitig; laufende Pushes werden in Reihe abgearbeitet statt
# einen halbfertigen Deploy abzubrechen.
concurrency:
  group: deploy-devtoys
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, devtoys]
    steps:
      - name: Pull latest code
        id: pull
        run: |
          set -e
          cd /mnt/data/claude/BokuNoDevToys
          before=$(git rev-parse HEAD)
          git fetch origin main
          git merge --ff-only origin/main
          after=$(git rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      - name: Detect if full rebuild is needed
        id: check
        run: |
          set -e
          cd /mnt/data/claude/BokuNoDevToys
          if [ "${{ github.event_name }}" != "push" ]; then
            # Zeitplan oder manueller Start: Basis-Abbild pruefen und neu bauen
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ steps.pull.outputs.before }}" "${{ steps.pull.outputs.after }}")
          if echo "$changed" | grep -qE '^(package(-lock)?\.json|Dockerfile|nginx\.conf|docker-compose\.yml)$'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
          # MCP-Server (eigener Container) hat ein eigenes Image und wird vom Quick Build nicht erfasst
          if echo "$changed" | grep -qE '^(mcp-server/|src/lib/core/|Dockerfile\.mcp$)'; then
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Full rebuild (dependency/Dockerfile/nginx changes)
        if: steps.check.outputs.full == 'true'
        run: |
          set -e
          cd /mnt/data/claude/BokuNoDevToys
          # Zeitplan/manuell: nur --pull (Cache bleibt, schnell). Bei Push mit
          # geaenderten Abhaengigkeiten wie bisher --no-cache.
          # flock: nie zwei Builds gleichzeitig am Server (Docker-Absturz
          # am 25.09.2026), gemeinsam mit den anderen naechtlichen Jobs.
          if [ "${{ github.event_name }}" = "push" ]; then args="--no-cache"; else args="--pull"; fi
          flock -w 5400 /tmp/docker-nachtbuild.lock docker compose build $args
          docker compose up -d

      - name: Quick build (code/content changes only)
        if: steps.check.outputs.full == 'false'
        run: |
          set -e
          cd /mnt/data/claude/BokuNoDevToys
          docker compose run --rm builder npm run build
          docker compose restart devtoys

      - name: Rebuild MCP server (mcp-server or shared core changed)
        if: steps.check.outputs.full == 'false' && steps.check.outputs.mcp == 'true'
        run: |
          set -e
          cd /mnt/data/claude/BokuNoDevToys
          flock -w 5400 /tmp/docker-nachtbuild.lock docker compose build mcp
          docker compose up -d mcp
