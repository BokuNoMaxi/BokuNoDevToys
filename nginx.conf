# MCP-Endpunkt ist offen: grobe Obergrenze gegen Missbrauch. Bewusst großzügig, weil Anfragen von
# Claude (claude.ai) aus wenigen gemeinsamen Anthropic-IPs kommen und hinter einem vorgeschalteten
# Reverse Proxy $binary_remote_addr ggf. dessen Adresse ist (dann gilt das Limit global).
limit_req_zone $binary_remote_addr zone=mcp:10m rate=50r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html 200.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self' https://corsproxy.bokunocompany.at https://ipapi.co https://api.ipify.org https://api64.ipify.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Remote-MCP-Server (Streamable HTTP, zustandslos) — siehe Dockerfile.mcp.
    # Upstream per Variable + resolver: Ist der mcp-Container down, antwortet nur /mcp mit 502,
    # nginx und die Seite laufen unbeeinträchtigt weiter.
    location = /mcp {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_upstream http://mcp:3000;
        limit_req zone=mcp burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 6m;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # MCP-Clients prüfen OAuth-Discovery-Pfade. Ohne diese Regel würde der SPA-Fallback
    # (200 + HTML) antworten und der Client könnte einen Auth-Flow erwarten. Der Server ist offen.
    location ~ ^/\.well-known/(oauth-|openid-) {
        return 404;
    }

    location / {
        # $uri.html: prerenderte Seiten (z.B. /tools/datetime -> tools/datetime.html)
        try_files $uri $uri.html $uri/ /200.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in einem location-Block verwirft die vom server-Block
        # geerbten Header — daher hier wiederholen
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self' https://corsproxy.bokunocompany.at https://ipapi.co https://api.ipify.org https://api64.ipify.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
